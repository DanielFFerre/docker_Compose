name: Deploy Docker Compose (Aula 11)
on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy via SSH no Servidor
    runs-on: ubuntu-latest
    steps:
      - name: Executar script de Deploy
        uses: appleboy/ssh-action@v1
        env:
          DEPLOY_REPOSITORY: ${{ github.repository }}
          PROD_DB_PASSWORD: ${{ secrets.PROD_DB_PASSWORD }}
          PROD_DB_ROOT_PASSWORD: ${{ secrets.PROD_DB_ROOT_PASSWORD }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          envs: DEPLOY_REPOSITORY, PROD_DB_PASSWORD, PROD_DB_ROOT_PASSWORD
          script: |
            set -e
            # Identifica o repositorio e cria um nome exclusivo
            PROJECT_NAME=$(echo "$DEPLOY_REPOSITORY" | tr '[:upper:]' '[:lower:]' | sed 's#[^a-z0-9_-]#-#g')
            PROJECT_DIR="$HOME/$PROJECT_NAME"
            REPO_URL="https://github.com/${DEPLOY_REPOSITORY}.git"
            
            # Clona se nao existir
            if [ ! -d "$PROJECT_DIR/.git" ]; then
              git clone "$REPO_URL" "$PROJECT_DIR"
            fi
            
            cd "$PROJECT_DIR"
            git pull origin main
            
            # Cria o .env desse projeto
            umask 077
            printf "DB_PASSWORD='%s'\nDB_ROOT_PASSWORD='%s'\n" "$PROD_DB_PASSWORD" "$PROD_DB_ROOT_PASSWORD" > .env
            chmod 600 .env
            
            # Atualiza somente o projeto desse grupo
            docker compose -p "$PROJECT_NAME" config -q
            docker compose -p "$PROJECT_NAME" pull
            docker compose -p "$PROJECT_NAME" up -d --no-build --remove-orphans
            docker compose -p "$PROJECT_NAME" ps